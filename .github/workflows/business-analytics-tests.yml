name: Customer 360 data and analytics tests

on:
  push:
    branches: [feature/platform-foundation]
  pull_request:
    branches: [main]

jobs:
  business-platform-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pytest openpyxl
      - name: Run platform tests
        run: |
          pytest -q tests/test_data_translation.py
          pytest -q tests/test_business_analytics.py
          pytest -q tests/test_relationship_integrity.py
          pytest -q tests/test_customer_360_detail.py
          pytest -q tests/test_ai_analytics_tools.py
