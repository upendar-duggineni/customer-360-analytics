name: Customer 360 analytics tests

on:
  push:
    branches: [feature/platform-foundation]
  pull_request:
    branches: [main]

jobs:
  business-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analytics dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pytest
      - name: Run business analytics tests
        run: pytest -q tests/test_business_analytics.py
